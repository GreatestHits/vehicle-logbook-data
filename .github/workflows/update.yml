name: 更新油价数据

on:
  schedule:
    # 北京时间 08:30、20:30（cron 用 UTC）
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取油价、节假日，生成数据文件
        env:
          JUHE_KEY: ${{ secrets.JUHE_KEY }}
        run: python scripts/update.py
      - name: 提交
        run: |
          git config user.name "vehicle-logbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "数据更新 $(TZ=Asia/Shanghai date +'%F %H:%M')"
          git push
      - name: 刷新 jsDelivr 缓存
        # jsDelivr 对 @master 最多缓存约 12 小时，更新后主动刷新，App 才能尽快拿到新价格
        run: |
          for f in oil/latest.json oil/history.json oil/adjustments.json; do
            curl -s -m 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@master/$f" > /dev/null || true
          done
      - name: 同步到 Gitee 私有备份
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "未配置 GITEE_TOKEN，跳过"; exit 0; fi
          git push --force "https://My_Gavin:${GITEE_TOKEN}@gitee.com/My_Gavin/vehicle-logbook-data.git" HEAD:master
